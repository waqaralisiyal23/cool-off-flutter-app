targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps full precision and reads clearly in a
          # debugger. Every timestamp column also goes through
          # UtcDateTimeConverter, so all stored values are UTC and compare
          # correctly as text (docs/11-data-and-sync.md).
          store_date_time_values_as_text: true
          databases:
            app_database: lib/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
